<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1a1a" />
  <meta name="description" content="MiniNomad - Lightweight 3D Sculpting with AI Control" />
  <title>MiniNomad</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; }
    #app { position: relative; width: 100vw; height: 100vh; background: #1a1a1a; }
    #canvas-container { position: absolute; top: 44px; left: 0; right: 0; bottom: 56px; overflow: hidden; }
    #canvas-container canvas { display: block; touch-action: none; }
    .mn-loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #e8731a; font-size: 16px; z-index: 200; font-family: sans-serif; }
    .mn-status { position: fixed; top: 48px; right: 60px; font-size: 10px; color: #888; z-index: 98; pointer-events: none; font-family: monospace; }
  </style>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <div id="canvas-container"></div>
    <div class="mn-loading" id="loading">Loading MiniNomad</div>
    <div class="mn-status" id="status">Initializing...</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
